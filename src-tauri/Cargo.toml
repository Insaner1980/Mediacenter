[package]
name = "mediacenter"
version = "0.1.6"
edition = "2021"
default-run = "mediacenter"
description = "Personal Linux desktop media center"
license = "MIT"

[lib]
name = "mediacenter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["full"] }
tokio-util = { version = "=0.7.20", features = ["rt"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
nix = { version = "=0.31.3", features = ["signal", "process"] }
ts-rs = { version = "=12.0.1", features = ["serde-compat"] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-single-instance = "=2.5.5"

zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

base64 = "=0.23.1"
sha2 = "=0.10.9"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }
getrandom = "=0.4.3"
subtle = "=2.6.1"
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
futures-util = { version = "=0.3.34", features = ["sink"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.54.1", features = ["test-util"] }
